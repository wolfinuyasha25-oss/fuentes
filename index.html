<!DOCTYPE html>
<html>
<head>
    <title>JN CLOTHING</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            text-align: center;
            background-color: #f5f0eb;

            background-image: url("https://www.avikalp.com/cdn/shop/products/MWZ3641_wallpaper2.jpg?v=1746036209");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
}

        header {
            background-color: #5c4033;
            color: white;
            padding: 30px;
        }

        header h1 {
            margin: 0;
        }

        .cards {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px;
            flex-wrap: wrap;
        }

        .card {
            background-color: white;
            width: 200px;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 3px 8px gray;
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
        }

        .card h3 {
            color: #5c4033;
        }

        .price {
            color: #8b5e3c;
            font-weight: bold;
        }

        .feedback {
            background-color: white;
            width: 350px;
            margin: 30px auto;
            padding: 20px;
            border-radius: 10px;
        }

        .feedback h2 {
            color: #5c4033;
        }

        input,
        select,
        textarea {
            width: 90%;
            padding: 10px;
            margin: 7px;
        }

        textarea {
            height: 80px;
        }

        button {
            background-color: #5c4033;
            color: white;
            border: none;
            padding: 10px 30px;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <header>
        <h1>JN CLOTHING</h1>
        <p>Find your style with us!</p>
    </header>

    <h2>Our Products</h2>

    <div class="cards">

        <div class="card">
            <img src="https://i.pinimg.com/736x/83/be/90/83be90e4fc3e76318ef28ade607670cb.jpg" alt="T-Shirt">
            <h3>Basic T-Shirt</h3>
            <p>Comfortable cotton shirt.</p>
            <p class="price">₱399</p>
            <button class="buy-button"
            onclick="buyNow('Simple t-Shirt')">
            Buy Now
            </button>
        </div>

        <div class="card">
            <img src="https://m.media-amazon.com/images/I/715TdaWb12L._AC_UY1000_.jpg" alt="Jeans">
            <h3>Baggy</h3>
            <p>Stylish and comfortable.</p>
            <p class="price">₱799</p>
            <button class="buy-button"
            onclick="buyNow('Simple Baggy')">
            Buy Now
            </button>
        </div>

        <div class="card">
            <img src="https://cdn-images.farfetch-contents.com/32/49/72/70/32497270_62840097_600.jpg" alt="Hoodie">
            <h3>Hoodie</h3>
            <p>Perfect for a cool day.</p>
            <p class="price">₱699</p>
            <button class="buy-button"
                onclick="buyNow('Simple Hoodie')">
                Buy Now
            </button>
        </div>

        <div class="card">
            <img src="https://img.lazcdn.com/g/p/544f88711f40077c92cc922c1ff81736.jpg_720x720q80.jpg" alt="Jacket">
            <h3>Casual Jacket</h3>
            <p>Stylish and comfortable.</p>
            <p class="price">₱999</p>
            <button class="buy-button"
                onclick="buyNow('Simple Casual Jacket')">
                Buy Now
            </button>
        </div>

        <div class="card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSfTZVzB1v0fvHBp-xm8HcnU7UeVi-UNvJazhPKcU7Xj1IBSiR-TAWnA1I&s=10" alt="Cap">
            <h3>Classic Cap</h3>
            <p>perfect for everyday wear.</p>
            <p class="price">₱299</p>
            <button class="buy-button"
                onclick="buyNow('Simple Classic Cap')">
                Buy Now
            </button>
        </div>

    </div>

    <div class="feedback">

        <h2>Customer Feedback</h2>

        <form onsubmit="submitForm(event)">

            <input type="text"
                   placeholder="Full Name"
                   required>

            <input type="email"
                   placeholder="Email"
                   required>

            <select required>
                <option value="">Choose Rating</option>
                <option>5 - Excellent</option>
                <option>4 - Very Good</option>
                <option>3 - Good</option>
                <option>2 - Fair</option>
                <option>1 - Poor</option>
            </select>

            <input type="text"
                   placeholder="Suggestions"
                   required>

            <button type="submit">
                Submit
            </button>

        </form>

    </div>

</body>
</html>
